<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>搜索结果 - Apple Music System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --apple-red: #ff2d55;
            --apple-blue: #007aff;
            --apple-silver: #f5f5f7;
            --text-secondary: #86868b;
        }
        body { 
            margin: 0; 
            font-family: 'Outfit', -apple-system, sans-serif;
            background-color: var(--apple-silver);
            color: #1d1d1f;
        }
        .header {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 64px;
        }
        .nav-brand { font-weight: 600; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; color: #000; text-decoration: none; }
        .nav-links { display: flex; gap: 30px; height: 100%; align-items: center; }
        .nav-item { 
            text-decoration: none; color: #1d1d1f; font-size: 0.95rem; font-weight: 500;
            height: 100%; display: flex; align-items: center; padding: 0 5px;
            position: relative; transition: 0.3s;
        }
        .nav-item:hover { color: var(--apple-red); }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .results-card { background: #fff; border-radius: 20px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        
        .result-item { 
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 0; border-bottom: 1px solid #f0f0f0; gap: 20px;
        }
        .result-thumb { 
            width: 50px; height: 50px; border-radius: 8px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 1.2rem; font-weight: 600;
        }
        .c1 { background: #FFD1DC; }
        .c2 { background: #BFFCC6; }
        .c3 { background: #B19CD9; }
        .c4 { background: #ACE5EE; }
        .c5 { background: #FFD700; }
        .c6 { background: #FFB347; }
        .c7 { background: #B3E5FC; }
        .c8 { background: #F8BBD0; }
        .c9 { background: #E1BEE7; }
        .c10 { background: #DCEDC8; }
        
        .result-info { flex: 1; }
        .result-info h4 { margin: 0; font-size: 1.1rem; }
        
        .btn-play { 
            background: var(--apple-blue); color: #fff; text-decoration: none;
            padding: 8px 16px; border-radius: 12px; font-size: 0.85rem; font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="nav-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 5px;">
                <path d="M9 18V5L19 3V16" stroke="var(--apple-red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="6" cy="18" r="3" stroke="var(--apple-red)" stroke-width="2"/>
                <circle cx="16" cy="16" r="3" stroke="var(--apple-red)" stroke-width="2"/>
            </svg>
            Music System
        </a>
        <div class="nav-links">
            <a href="/" class="nav-item">推荐中心</a>
            <a href="/report/" class="nav-item">算法评估报告</a>
                <a href="/profile/" class="nav-item">我的音乐</a>
        </div>
    </div>

    <div class="container">
        <h2 style="margin-bottom: 30px;">🔍 搜索结果: "{{ query }}"</h2>
        
        <div class="results-card">
            {% if results %}
                {% for item in results %}
                <div class="result-item">
                    <div class="result-thumb {% cycle 'c1' 'c2' 'c3' 'c4' 'c5' 'c6' 'c7' 'c8' 'c9' 'c10' %}"></div>
                    <div class="result-info">
                        <h4>{{ item.name }}</h4>
                        <p>{{ item.artist }} · {{ item.album }}</p>
                    </div>
                    <a href="/music/{{ item.id }}/" class="btn-play">查看详情</a>
                </div>
                {% endfor %}
            {% else %}
                <div style="text-align: center; padding: 50px; color: #888;">
                    没有找到匹配的音乐
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>

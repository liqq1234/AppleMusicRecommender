<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Apple Music System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --apple-red: #ff2d55;
            --apple-blue: #007aff;
            --apple-silver: #f5f5f7;
            --glass: rgba(255, 255, 255, 0.8);
            --text-secondary: #86868b;
        }
        body { 
            margin: 0; font-family: 'Outfit', sans-serif; 
            background: linear-gradient(135deg, #f5f5f7 0%, #fff 100%);
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .reg-card {
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            width: 100%; max-width: 450px; padding: 40px 50px; border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05); text-align: center;
        }
        h1 { font-weight: 600; font-size: 1.8rem; margin-bottom: 5px; letter-spacing: -0.5px; }
        p { color: var(--text-secondary); margin-bottom: 30px; font-size: 0.95rem; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; margin-bottom: 15px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 0.85rem; font-weight: 600; color: #1d1d1f; display: block; margin-bottom: 6px; margin-left: 5px; }
        input {
            width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid #ddd;
            font-size: 0.95rem; box-sizing: border-box; transition: 0.3s; background: rgba(255,255,255,0.5);
        }
        input:focus { outline: none; border-color: var(--apple-blue); box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }
        
        .btn-primary {
            width: 100%; background: var(--apple-red); color: #fff; border: none; padding: 14px;
            border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer;
            margin-top: 15px; transition: 0.3s;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 5px 15px rgba(255,45,85,0.2); }
        
        .footer-links { margin-top: 25px; font-size: 0.9rem; color: var(--text-secondary); }
        .footer-links a { color: var(--apple-blue); text-decoration: none; font-weight: 500; }
        
        .error-msg { background: #feeef2; color: var(--apple-red); padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="reg-card">
        <div class="logo" style="font-size: 3rem; color: var(--apple-red); margin-bottom: 10px;">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="var(--apple-red)" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
        </div>
        <h1>创建个人账号</h1>
        <p>开启基于 SVD 算法的智能音乐之旅</p>

        {% if error %}
        <div class="error-msg">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" placeholder="建议使用英文名或常用 ID" required>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>展示姓名</label>
                    <input type="text" name="name" placeholder="您的称呼" required>
                </div>
                <div class="form-group">
                    <label>电子邮箱</label>
                    <input type="email" name="email" placeholder="xxx@example.com">
                </div>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="至少6位字符" required>
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" name="re_password" placeholder="请再次输入密码" required>
            </div>
            <button type="submit" class="btn-primary">创建账户</button>
        </form>

        <div class="footer-links">
            已经有账号了？ <a href="/login/">立即登录</a>
        </div>
    </div>
</body>
</html>
